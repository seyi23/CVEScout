name: Bug report
description: Something does not work as expected
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
  - type: input
    id: versions
    attributes:
      label: CVEScout and macOS version
      placeholder: "CVEScout 0.3.0, macOS 27.2.1"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: CLI output (optional)
      description: "`cvescout --no-checks` output, with anything personal removed"
      render: text
